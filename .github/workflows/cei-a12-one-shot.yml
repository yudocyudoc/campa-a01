# One-time archive, deleted from the branch after verified evidence commit.
name: CEI | A12 negative-gate evidence archive

on:
  push:
    branches:
      - exp/A12-decision-value-gate
    paths:
      - '.github/workflows/cei-a12-one-shot.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve ORIGINAL candidate-only gate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p experiments/A12/evidence
          gh run download 38186398116 --repo "$GITHUB_REPOSITORY" --name a12-frozen-candidate-only --dir experiments/A12/evidence
      - name: Verify negative gate, original A11 inputs and all SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          base=Path("experiments/A12/evidence")
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          gate=json.loads((base/"gate.json").read_text(encoding="utf-8"))
          assert gate["experiment"]=="A12"
          assert gate["stage"]=="CANDIDATE_ONLY_DECISION_VALUE_GATE"
          assert gate["verdict"]=="NO_MATERIAL_DECISION_DISAGREEMENT"
          assert gate["authorization_for_world"] is False
          assert gate["world_evaluated_in_gate"] is False
          assert gate["qualifying_in_both_arms"]==0
          for name,expected in gate["csv_sha256"].items():
              assert sha(base/name)==expected,(name,"gate CSV mutated")
          linked={
             "a11_analyst_freeze":"experiments/A11/evidence/analyst/analyst_freeze.json",
             "a11_predecision_snapshot":"experiments/A11/evidence/public/predecision_snapshot.csv",
             "a11_frozen_forecasts":"experiments/A11/evidence/analyst/closedloop_forecasts.csv",
          }
          for key,path in linked.items():
              assert sha(Path(path))==gate["source_sha256"][key],(key,"source mutated")
          with (base/"scenarios.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
              assert len(rows)==18
              assert all(row["passes_5pct_symmetric"]=="False" for row in rows)
              assert sum(row["models_disagree"]=="True" for row in rows)==8
          with (base/"candidate_policy_cash.csv").open(newline="") as f:
              assert sum(1 for _ in csv.DictReader(f))==1260
          audit={
              "experiment":"A12",
              "original_workflow_run_id":38186398116,
              "scientific_source_head":"03f944ef83b8070efd9204c8c205cb63fbda5767",
              "world_stage":"SKIPPED_BY_CANDIDATE_GATE",
              "source":"Original successful CI files, extracted without modifications",
              "all_original_and_source_sha256_verified":True,
              "sha256":{p.name:sha(p) for p in sorted(base.glob("*")) if p.is_file()},
          }
          Path("experiments/A12/evidence_manifest.json").write_text(json.dumps(audit,indent=2,sort_keys=True)+"\n")
          print("A12_NEGATIVE_RESULT_ARCHIVED",{k:v for k,v in audit["sha256"].items()})
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38186398116/artifacts" --jq '.artifacts[].name' > /tmp/a12_artifact_names
          test "$(wc -l < /tmp/a12_artifact_names)" -eq 1
          grep -Fxq 'a12-frozen-candidate-only' /tmp/a12_artifact_names
      - name: Commit original negative evidence to experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f experiments/A12/evidence/ experiments/A12/evidence_manifest.json
          if git diff --cached --quiet; then
            echo 'Already archived'
          else
            git commit -m 'archive(A12): preserve negative gate and source SHA256'
            git push origin 'HEAD:refs/heads/exp/A12-decision-value-gate'
          fi
