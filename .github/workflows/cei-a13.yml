name: CEI | A13 error-source sensitivity (candidate-only)

on:
  pull_request:
    paths:
      - 'experiments/A13/**'
      - 'tests/test_a13.py'
      - '.github/workflows/cei-a13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exploratory-candidate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout ONLY disclosed models, frozen fits, predecision data, A12 forecasts and A13
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/A11/contract.py
            experiments/A11/evidence/analyst/analyst_freeze.json
            experiments/A11/evidence/public/predecision_snapshot.csv
            experiments/A12/evidence/candidate_policy_cash.csv
            experiments/A13/run.py
            experiments/A13/evidence_manifest.json
            experiments/A13/evidence/cases.csv
            experiments/A13/evidence/sources.csv
            experiments/A13/evidence/summary.json
            tests/test_a13.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no oracle or adjudicator files are checked out
        run: |
          test ! -e experiments/A08/g5_extended_core.py
          test ! -e experiments/A11/adjudicate.py
          test ! -e experiments/A12/adjudicate.py
          test ! -e experiments/A11/evidence/adjudication/world_policy_outcomes.csv
      - name: Test A12 numerical anchoring and sensitivity algebra
        run: python -m unittest discover -s tests -p 'test_a13.py' -v
      - name: Run all A13 exploratory cases
        run: python -m experiments.A13.run --out results/A13
      - name: Archive full exploratory matrix
        uses: actions/upload-artifact@v4
        with:
          name: a13-candidate-only-sensitivity
          path: results/A13/
          retention-days: 30
          if-no-files-found: error
