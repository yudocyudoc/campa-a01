name: CEI | A12 candidate-only decision-value gate

on:
  pull_request:
    paths:
      - 'experiments/A12/**'
      - 'tests/test_a12.py'
      - '.github/workflows/cei-a12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-only-gate:
    name: A12 | screen candidate decisions WITHOUT WORLD
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      world_authorized: ${{ steps.gate.outputs.world_authorized }}
    steps:
      - name: Sparse checkout only forecast contract and frozen A11 inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/A11/contract.py
            experiments/A11/evidence/analyst/analyst_freeze.json
            experiments/A11/evidence/analyst/closedloop_forecasts.csv
            experiments/A11/evidence/public/predecision_snapshot.csv
            experiments/A12/design.py
            experiments/A12/forecast.py
            experiments/A12/gate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify generator and WORLD outcome files are ABSENT
        run: |
          test ! -e experiments/A08/g5_extended_core.py
          test ! -e experiments/A11/adjudicate.py
          test ! -e experiments/A11/evidence/adjudication/world_policy_outcomes.csv
          test ! -e experiments/A12/adjudicate.py
      - name: Run strict 9 shock x 35 capacity x 2 family gate
        id: gate
        run: |
          python -m experiments.A12.gate --out results/A12/gate
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('results/A12/gate/gate.json'))
          print('world_authorized='+str(d['authorization_for_world']).lower())
          PY
      - name: Preserve negative results or frozen candidate-only gate
        uses: actions/upload-artifact@v4
        with:
          name: a12-frozen-candidate-only
          path: results/A12/gate/
          retention-days: 30
          if-no-files-found: error

  world-only-if-gate-passes:
    name: A12 | WORLD adjudication only after >=3 material BOTH-arm shocks
    needs: candidate-only-gate
    if: needs.candidate-only-gate.outputs.world_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original WORLD engine ONLY in adjudicator
        run: python -m pip install "setuptools<82" "jedi>=0.16" "bptk-py[plotting]==3.2.0" "networkx>=3,<4" "scipy>=1.11,<2"
      - uses: actions/download-artifact@v4
        with:
          name: a12-frozen-candidate-only
          path: results/A12/gate
      - name: WORLD run only for qualified frozen candidate-selected shock
        run: python -m experiments.A12.adjudicate --gate results/A12/gate --out results/A12/world
      - name: Preserve results even when WORLD differs from candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a12-conditional-world-results
          path: results/A12/world/
          retention-days: 30
          if-no-files-found: warn

  offline-regression:
    name: A12 | exact A11-equivalence and two-sided gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_a12.py' -v
