# Temporary: removes itself after the original A10b evidence is in Git.
name: CEI | A10b one-shot evidence archive

on:
  push:
    branches:
      - exp/A10b-noise-robustness
    paths:
      - '.github/workflows/cei-a10b-one-shot.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch original successful scientific artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p experiments/A10b/evidence/{public,analyst,postfreeze}
          gh run download 38182768010 --repo "$GITHUB_REPOSITORY" --name a10b-public-only --dir experiments/A10b/evidence/public
          gh run download 38182768010 --repo "$GITHUB_REPOSITORY" --name a10b-frozen-analyst --dir experiments/A10b/evidence/analyst
          gh run download 38182768010 --repo "$GITHUB_REPOSITORY" --name a10b-postfreeze-evidence --dir experiments/A10b/evidence/postfreeze
      - name: Verify all seeds, crossed hashes and adjudications
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,csv
          root=Path("experiments/A10b/evidence")
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          def read(p):return json.loads(p.read_text(encoding="utf-8"))
          b=read(root/"public/a10b_public_batch_manifest.json")
          a=read(root/"analyst/a10b_frozen_decisions.json")
          v=read(root/"postfreeze/A10b_summary.json")
          seeds=list(range(20261011,20261021))
          assert b["seeds"]==a["seeds"]==v["seeds"]==seeds
          assert b["sealed_labels_not_generated_or_published"] is True
          assert a["stage"]=="ALL_DECISIONS_FROZEN_BEFORE_ANY_SEALED_LABELS"
          assert sha(root/"public/a10b_public_batch_manifest.json")==a["public_batch_sha256"]
          decisions={x["seed"]:x for x in a["seed_results"]}
          for entry in b["per_seed"]:
              seed=entry["seed"]
              assert seed in seeds
              public=root/"public"/str(seed)
              for filename,expected in entry["checksums"].items():
                  assert sha(public/filename)==expected,(seed,filename,"public")
              report=root/"analyst"/str(seed)
              assert sha(report/"analyst_report.json")==decisions[seed]["report_sha256"]
              assert sha(report/"predicted_all_holdouts.csv")==decisions[seed]["predictions_sha256"]
              model=read(report/"analyst_report.json")
              for filename,expected in model["data_sha256"].items():
                  assert sha(public/filename)==expected,(seed,filename,"analyst")
              regen=root/"postfreeze/regenerated"/str(seed)
              for filename in entry["checksums"]:
                  assert sha(public/filename)==sha(regen/"public"/filename),(seed,filename,"regenerated")
              assert sha(public/"public_manifest.json")==sha(regen/"public/public_manifest.json")
              truth=read(regen/"sealed/sealed_truth.json")
              for filename,expected in truth["labels_sha256"].items():
                  assert sha(regen/"sealed"/filename)==expected,(seed,filename,"sealed")
              score=read(root/"postfreeze/scores"/str(seed)/"adjudication.json")
              assert score["adjudication_status"]=="COMPLETED"
              for filename,expected in score["analyst_artifact_sha256"].items():
                  assert sha(report/filename)==expected,(seed,filename,"cross-chain")
              assert score["results"]["noisy_1pct"]["training_only_decision"]==decisions[seed]["decision"]
          from collections import Counter
          counts=Counter(x["decision"] for x in a["seed_results"])
          assert sum(v["all_seed_decisions_count"].values())==len(seeds)
          assert all(v["all_seed_decisions_count"][key]==counts[key] for key in v["all_seed_decisions_count"])
          with (root/"postfreeze/all_seed_scores.csv").open(newline="") as fp:
              assert sum(1 for _ in csv.DictReader(fp))==20
          all_files={}
          for folder in ("public","analyst","postfreeze"):
              path=root/folder
              all_files[folder]={str(p.relative_to(path)):sha(p) for p in sorted(path.rglob("*")) if p.is_file()}
          audit={
              "experiment":"A10b","schema":"immutable original extracted evidence v1",
              "original_source_run_id":38182768010,
              "original_source_commit":"5945b1151530c315f084b352bae92c753e5f27d7",
              "original_artifact_ids":{"public":11717584906,"analyst":11718202541,"postfreeze":11717729837},
              "labels_first_generated_after_analyst_freeze":True,
              "source_model_version":"A10 unchanged","seed_count":10,
              "all_cross_file_sha256_chains_verified":True,
              "sha256_by_boundary":all_files,
          }
          dest=Path("experiments/A10b/evidence_manifest.json")
          dest.write_text(json.dumps(audit,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("A10B_ARCHIVE_VERIFIED", {k:len(v) for k,v in all_files.items()})
          PY
      - name: Commit exact source data and manifest to experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f experiments/A10b/evidence/ experiments/A10b/evidence_manifest.json
          if git diff --cached --quiet; then
            echo 'A10b evidence already preserved'
          else
            git commit -m 'archive(A10b): store 10 seeded public, frozen analyst and regenerated truth evidence'
            git push origin 'HEAD:refs/heads/exp/A10b-noise-robustness'
          fi
