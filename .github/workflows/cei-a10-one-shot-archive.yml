# One-time archive, immediately removed after successful execution.
name: CEI | A10 evidence preservation one-shot

on:
  push:
    branches:
      - exp/A10-observational-blindfold
    paths:
      - '.github/workflows/cei-a10-one-shot-archive.yml'

permissions:
  contents: write

jobs:
  archive-a10:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download four artifacts from verified A10 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p experiments/A10/evidence/{public,sealed,analyst,adjudicated}
          gh run download 38126170978 --repo "$GITHUB_REPOSITORY" --name a10-public-observations --dir experiments/A10/evidence/public
          gh run download 38126170978 --repo "$GITHUB_REPOSITORY" --name a10-sealed-labels --dir experiments/A10/evidence/sealed
          gh run download 38126170978 --repo "$GITHUB_REPOSITORY" --name a10-analyst-predictions --dir experiments/A10/evidence/analyst
          gh run download 38126170978 --repo "$GITHUB_REPOSITORY" --name a10-sealed-adjudication --dir experiments/A10/evidence/adjudicated
      - name: Validate every original dependency and checksum, without rewriting data
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path("experiments/A10/evidence")
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def load(p): return json.loads(p.read_text(encoding="utf-8"))
          m=load(base/"public/public_manifest.json")
          truth=load(base/"sealed/sealed_truth.json")
          analyst=load(base/"analyst/analyst_report.json")
          final=load(base/"adjudicated/adjudication.json")
          assert m["experiment"]=="A10"
          assert final["adjudication_status"]=="COMPLETED"
          for name,expected in truth["public_sha256"].items():
              assert digest(base/"public"/name)==expected,(name,"public")
          for name,expected in truth["labels_sha256"].items():
              assert digest(base/"sealed"/name)==expected,(name,"labels")
          for name,expected in analyst["data_sha256"].items():
              assert digest(base/"public"/name)==expected,(name,"analyst data")
          assert digest(base/"analyst/predicted_all_holdouts.csv")==analyst["prediction_sha256"]
          for name,expected in final["analyst_artifact_sha256"].items():
              assert digest(base/"analyst"/name)==expected,(name,"adjudicator")
          fields={}
          for folder in ("public","sealed","analyst","adjudicated"):
              fields[folder]={p.name:digest(p) for p in sorted((base/folder).glob("*")) if p.is_file()}
          out={
              "experiment":"A10",
              "source_workflow_run":38126170978,
              "source_experiment_commit":"a715e2511b89a21645e94dd7d3bd2cd859672b46",
              "original_artifact_data":"unaltered extracted CSV/JSON",
              "sha256_by_boundary":fields,
              "validated_dependency_hashes":True,
          }
          dest=Path("experiments/A10/evidence_manifest.json")
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("A10_ARCHIVE_VERIFIED", {x:len(v) for x,v in fields.items()})
          PY
      - name: Commit original snapshots and cryptographic audit manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f experiments/A10/evidence/ experiments/A10/evidence_manifest.json
          if git diff --cached --quiet; then
            echo 'A10 evidence already archived'
          else
            git commit -m 'archive(A10): preserve public analyst sealed and adjudication snapshots'
            git push origin "HEAD:refs/heads/exp/A10-observational-blindfold"
          fi
